<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="profile.css">
    <title>profile setup</title>
  </head>

  <body>
    <h1>create a shared identity</h1>
    <h2>it's quick and easy!</h2>

    <form id="profile">
      <label>your name</label>
      <span id="username" contenteditable="true">US</span>
      
      <label>what was the name of your first stuffed toy?</label>
      <span id="noun" contenteditable="true">grass</span>

      <label>what did you do during school breaks?</label>
      <span id="verb" contenteditable="true">grow</span>

      <label>how do you spend your free time?</label>
      <span id="adverb" contenteditable="true">slowly</span>

      <label>how does your online self describe your real self?</label>
      <span id="adjective" contenteditable="true">green</span>

      <label>who?</label>
      <span id="pronoun" contenteditable="true">it</span>

      <button id="register" type="submit">Register</button>
      <button id="view-profile" type="button" style="display: none;">View profile</button>
    </form>

<script>
const fields = ["username", "noun", "verb", "adverb", "adjective", "pronoun"];

function saveProfileData() {
  const data = {};
  fields.forEach(id => {
    data[id] = document.getElementById(id).innerText;
  });
  localStorage.setItem("profileData", JSON.stringify(data));
}

document.getElementById("profile").addEventListener("submit", (e) => {
  e.preventDefault();
  saveProfileData();
  document.getElementById("view-profile").style.display = "inline-block";
});

document.getElementById("view-profile").addEventListener("click", () => {
  window.location.href = "index.html";
});
</script>
